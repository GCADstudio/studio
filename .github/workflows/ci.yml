name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # x86_64 and arm64 on all three desktop systems (SPEC NFR-1, NFR-9).
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - windows-latest
          - windows-11-arm
          - macos-latest
          - macos-15-intel
        python: ["3.13"]
        include:
          - os: ubuntu-latest
            python: "3.11"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: System libraries for the test-only readers (MeshLab, Gmsh, Ghostscript)
        if: runner.os == 'Linux'
        run: |
          # man-db rebuilds its index after every package and makes apt take minutes
          echo "set man-db/auto-update false" | sudo debconf-set-selections
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 \
            libopengl0 libglu1-mesa ghostscript
      - run: python -m pip install -e ".[dev]"
      - name: Record platform
        run: python -c "import platform, sys; print(platform.platform(), platform.machine(), sys.version)"
      - run: pytest -q -rs
        env:
          GCAD_REQUIRE_READERS: "1"
      - name: CLI smoke test (no display, no GPU)
        shell: bash
        run: |
          gcad kernels
          for kernel in csg minscad parts; do
            gcad kernel check "src/gcad/kernels/$kernel"
          done
          gcad formats
          for fmt in dxf svg pdf eps cgm; do
            gcad export src/gcad/kernels/minscad/examples/plate2d.mscad -o "out/plate2d.$fmt"
            gcad export src/gcad/kernels/minscad/examples/section.mscad -o "out/section.$fmt"
          done
          for fmt in stl obj glb x3d wrl dae unv; do
            gcad export src/gcad/kernels/csg/examples/bracket.gcsg -o "out/bracket.$fmt"
            gcad export src/gcad/kernels/minscad/examples/flange.mscad -o "out/flange.$fmt"
            gcad export src/gcad/kernels/parts/examples/plate.parts -o "out/plate.$fmt"
          done
          if python -c "import OCP" 2>/dev/null; then
            for fmt in step igs; do
              gcad export src/gcad/kernels/minscad/examples/flange.mscad -o "out/flange.$fmt"
            done
          else
            # SPEC AC-6: no OpenCASCADE build here; exact formats must say why
            if gcad export src/gcad/kernels/minscad/examples/flange.mscad -o out/flange.step 2> err.txt; then
              echo "STEP export should have failed without OpenCASCADE"; exit 1
            fi
            grep "no build for this platform" err.txt
          fi
          ls -l out

  # The studio in a real headless browser (SPEC NFR-9). It uses the Chrome the runner image
  # already has, and SwiftShader, Chrome's CPU WebGL: the viewer must work without a GPU.
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]" playwright
      - run: pytest -q -rs tests/test_ui.py
        env:
          GCAD_REQUIRE_UI: "1"
          GCAD_UI_ARTIFACTS: ui-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: ui-screenshots
          if-no-files-found: ignore

  # The web studio (SPEC §4.1, AC-9 to AC-12): build the static site from the pinned,
  # checksummed assets and drive it in headless Chrome, with the Python core in Pyodide and
  # only a static file server behind it. On master the tested site becomes the Pages artifact.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]" playwright
      - uses: actions/cache@v4
        with:
          path: .cache/site-assets
          key: site-assets-${{ hashFiles('tools/site-assets.toml') }}
      - name: Build the site
        run: python tools/build_site.py --out site
      - run: pytest -q -rs tests/test_web.py
        env:
          GCAD_SITE: site
          GCAD_REQUIRE_WEB: "1"
          GCAD_REQUIRE_READERS: "1"
          GCAD_UI_ARTIFACTS: web-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-screenshots
          path: web-screenshots
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          path: site

  # Publishes the site the web job built and tested, only from master. GitHub Pages must be
  # enabled for the repository with source "GitHub Actions".
  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

  # LibreOffice is the only independent CGM reader; it is large, so it gets a job of its own
  # where a slow package mirror cannot hold up the main matrix.
  libreoffice:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install LibreOffice Draw and Impress
        run: |
          echo "set man-db/auto-update false" | sudo debconf-set-selections
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 \
            libreoffice-draw libreoffice-impress
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q -rs tests/test_2d_formats.py -k libreoffice
        env:
          GCAD_REQUIRE_LIBREOFFICE: "1"
          GCAD_READER_ARTIFACTS: libreoffice-output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: libreoffice-output
          path: libreoffice-output
          if-no-files-found: ignore
