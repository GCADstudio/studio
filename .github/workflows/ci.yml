name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # x86_64 and arm64 on all three desktop systems (SPEC NFR-1, NFR-9).
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - windows-latest
          - windows-11-arm
          - macos-latest
          - macos-15-intel
        python: ["3.13"]
        include:
          - os: ubuntu-latest
            python: "3.11"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - name: Record platform
        run: python -c "import platform, sys; print(platform.platform(), platform.machine(), sys.version)"
      - run: pytest -q
      - name: CLI smoke test (no display, no GPU)
        shell: bash
        run: |
          gcad kernels
          for fmt in stl obj glb; do
            gcad export src/gcad/kernels/csg/examples/bracket.gcsg -o "out/bracket.$fmt"
          done
          ls -l out
