[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "gcad-studio"
dynamic = ["version"]
description = "Language-agnostic, code-first CAD studio: define a modelling language by its grammar, render it, export it."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "GCADstudio contributors" }]
keywords = ["cad", "csg", "openscad", "grammar", "stl", "gltf", "step"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    # Exact B-rep back-end (STEP, IGES). There is no build for Windows on ARM; there the
    # studio runs on the Manifold mesh back-end alone (SPEC NFR-1).
    "cadquery-ocp>=8.0.1; sys_platform != 'win32' or platform_machine != 'ARM64'",
    "ezdxf>=1.1",
    "lark>=1.2",
    "manifold3d>=3.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    # independent readers used to check exports (EX-6)
    "trimesh>=4",
    "pycollada>=0.8",
    "pyuff>=2.4",
    "steputils>=0.1",
    "svgelements>=1.9",
    # pdfminer.six needs cryptography, which has no Windows-on-ARM wheel
    "pdfminer.six>=20231228; sys_platform != 'win32' or platform_machine != 'ARM64'",
    "pymeshlab>=2023.12; sys_platform != 'win32' or platform_machine != 'ARM64'",
    "gmsh>=4.11; (sys_platform != 'linux' or platform_machine == 'x86_64') and (sys_platform != 'win32' or platform_machine != 'ARM64')",
]

[project.scripts]
gcad = "gcad.cli:main"

[project.urls]
Homepage = "https://github.com/GCADstudio/studio"
Discussion = "https://github.com/openscad/openscad/issues/2299"

[tool.hatch.version]
path = "src/gcad/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/gcad"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Example scripts of process kernels run inside their own language's environment, which
# supplies names such as CadQuery's show_object.
"src/gcad/kernels/*/examples/*" = ["F821"]

[tool.mypy]
python_version = "3.11"
files = ["src/gcad"]
# The programs of process kernels are separate scripts, run by their own interpreter.
exclude = ['src/gcad/kernels/[^/]+/(program\.py|examples/)']
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["manifold3d", "manifold3d.*", "OCP", "OCP.*"]
ignore_missing_imports = true
follow_imports = "skip"

# Only inside Pyodide (the web studio, SPEC §4.1): its FFI, the JS global scope, and the
# Manifold WebAssembly module the worker registers.
[[tool.mypy.overrides]]
module = ["pyodide", "pyodide.*", "js", "_gcad_manifold"]
ignore_missing_imports = true
